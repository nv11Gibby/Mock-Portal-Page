# Imperial Holdings Group: Netlify configuration.
# `npm run build` (build/build.js) prerenders every route into dist/, which is what Netlify publishes. The Netlify
# functions stay at the repository root. Every form submission triggers netlify/functions/submission-created.js,
# which creates the lead or deal in Pipedrive. See build/README.md for the LAUNCH and BUILD_PREVIEW switches.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Set PIPEDRIVE_API_TOKEN in Site configuration > Environment variables (never in this file).
# Optional: PIPEDRIVE_OWNER_CLIENTS, PIPEDRIVE_OWNER_PARTNERS, PIPEDRIVE_OWNER_INSTITUTIONS (Pipedrive user ids),
# PIPEDRIVE_PIPELINE_PARTNERS / PIPEDRIVE_STAGE_PARTNERS, PIPEDRIVE_PIPELINE_INSTITUTIONS / PIPEDRIVE_STAGE_INSTITUTIONS.
